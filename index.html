      <div class="tbl-wrap"><table class="dark-table"><thead><tr><th>파일 이름</th><th>내용</th><th>상태</th></tr></thead><tbody>
      ${Object.entries(BG_KEYS).map(([k,d])=>`<tr><td><code>bg_${k}.jpg</code></td><td>배경 · ${d}</td><td class="ox ${IOK['bg_'+k]?'o':'x'}">${IOK['bg_'+k]?'연결됨':'기본 그림'}</td></tr>`).join('')}
      ${Object.entries(CH_KEYS).map(([c,es])=>es.map(e=>`<tr><td><code>ch_${c}_${e}.png</code></td><td>인물 · ${({yun:'윤서',harmo:'하모',hildegard:'힐데가르트',bach:'바흐',beethoven:'베토벤',chopin:'쇼팽',cage:'케이지'})[c]} (${e})</td><td class="ox ${IOK[`ch_${c}_${e}`]?'o':'x'}">${IOK[`ch_${c}_${e}`]?'연결됨':e==='normal'?'기본 그림':'normal로 대체'}</td></tr>`).join('')).join('')}
      </tbody></table></div></section>
    <section><h3>4분 33초 미션 길이</h3>
      <div class="seg" role="group" aria-label="4분 33초 길이"><button id="oS" aria-pressed="${opts.silence!=='full'}">수업용 33초</button><button id="oF" aria-pressed="${opts.silence==='full'}">원곡 4분 33초</button></div></section>
    <section><h3>제출된 결과 확인</h3><p class="muted" style="margin:0">학생이 붙여 넣은 결과 글을 그대로 붙여 넣으세요. 여러 명을 한꺼번에 넣어도 돼요. 글을 고쳐 쓰면 확인번호가 맞지 않아요.</p>
      <textarea id="vIn" class="btn" style="width:100%;min-height:9em;text-align:left;font-family:var(--f-mono);font-size:13px" placeholder="[타임 하모니 수료] …&#10;…&#10;확인번호: TH-…"></textarea>
      <div class="acts"><button class="btn primary" id="vGo">확인하기</button></div><div id="vOut"></div></section>
    <section><h3>평가 기록 방식</h3><ul>
      <li><b>음악사 퀴즈 정답률</b>: 음악 단서 5문항 + 대화 속 지식 문항 5개 + 쇼팽 감상 3문항, 모두 <b>첫 번째 답</b>만 기록해요 (총 13문항). 창을 두 개 띄워 한쪽에서 답을 미리 봐도 먼저 고른 답이 남아요.</li>
      <li><b>미니게임 한 번에 성공</b>: 네우마 3라운드, 대위법 2라운드, 운명 리듬, 4분 33초 — 총 7개. 대위법에서 힌트를 쓰면 ‘한 번에 성공’으로 치지 않아요.</li>
      <li><b>도전 회차</b>: 같은 기기에서 ‘새로 시작’한 횟수예요. 답을 외운 뒤 다시 시작하면 회차가 올라가요. 수료증과 결과 글에 함께 나와요.</li>
      <li><b>기록이 빠진 활동</b>: 13문항·7개 미니게임 중 기록이 없는 것이 있으면 수료증에 빨간 글씨로 표시돼요(정상적으로 하면 생기지 않아요).</li>
      <li>기록은 각 학생 기기의 브라우저에만 저장돼요. 결과는 수료증 화면에서 글로 복사해 제출받고, 위 ‘제출된 결과 확인’으로 확인번호를 확인하세요.</li></ul></section>
    <section><h3>문항과 정답</h3><div class="tbl-wrap"><table class="dark-table"><thead><tr><th>시대</th><th>문항</th><th>정답</th></tr></thead><tbody>${items.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div></section>
    <section><h3>이 기기의 수료 기록 (${h.length}건)</h3>${h.length?`<div class="tbl-wrap"><table class="dark-table"><thead><tr><th>이름</th><th>학번·반</th><th>수료 일시</th><th>퀴즈</th><th>미니게임</th><th>균열</th><th>시간</th><th>회차</th><th>확인번호</th></tr></thead><tbody>${h.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.cls)}</td><td>${esc(r.date)}</td><td class="n">${r.pct}% (${r.q})</td><td class="n">${r.g}</td><td class="n">${r.glitch}</td><td class="n">${r.min}분</td><td class="n">${r.att||'—'}</td><td class="n">${esc(r.code||'—')}</td></tr>`).join('')}</tbody></table></div><div class="acts"><button class="btn" id="clr">기록 지우기</button></div>`:'<p class="muted" style="margin:0">아직 이 기기에서 수료한 기록이 없어요.</p>'}</section>
    <div class="acts"><button class="btn primary" id="back">처음 화면으로</button></div></section>`;
  $('#oS').onclick=()=>{opts.silence='short';store.set(OPT_KEY,opts);screenTeacher()};
  $('#oF').onclick=()=>{opts.silence='full';store.set(OPT_KEY,opts);screenTeacher()};
  if($('#clr')) $('#clr').onclick=()=>confirmBox('이 기기의 수료 기록을 모두 지울까요?','지우기','취소',()=>{store.del(HIST_KEY);screenTeacher()});
  $('#vGo').onclick=()=>{
    const blocks=$('#vIn').value.split(/(?=\[타임 하모니 )/).map(s=>s.trim()).filter(Boolean);
    if(!blocks.length){$('#vOut').innerHTML='<p class="msg bad">붙여 넣은 결과가 없어요.</p>';return}
    $('#vOut').innerHTML=`<div class="tbl-wrap"><table class="dark-table"><thead><tr><th>결과</th><th>이름</th><th>학번·반</th><th>퀴즈</th><th>미니게임</th><th>회차</th><th>시간</th></tr></thead><tbody>${blocks.map(b=>{const r=parseResult(b);
      if(!r) return `<tr><td class="ox x">형식 오류</td><td colspan="6">${esc(b.split('\n')[0].slice(0,40))} — 줄이 빠졌거나 바뀌었어요</td></tr>`;
      return `<tr><td class="ox ${r.ok?'o':'x'}">${r.ok?'확인됨':'불일치'}</td><td>${esc(r.name)}</td><td>${esc(r.cls)}</td><td class="n">${esc(r.pct)}% (${esc(r.q)})</td><td class="n">${esc(r.g)}</td><td class="n">${esc(r.att)}</td><td class="n">${esc(r.min)}분</td></tr>`}).join('')}</tbody></table></div>
      <p class="muted" style="margin:6px 0 0">‘불일치’는 결과 글의 숫자나 이름이 게임이 만든 내용과 달라졌다는 뜻이에요.</p>`};
  $('#back').onclick=screenTitle;
}

/* 같은 게임이 다른 창(탭)에서도 열려 있으면 이 창을 멈춤 */
window.addEventListener('storage',e=>{
  if(e.key!==SAVE_KEY) return;
  endGame(); stopClip(); bgmStop(); overlay.dataset.dismiss='0';
  openOverlay(`<p class="eyebrow">창이 두 개 열려 있어요</p><h2 style="font-size:26px">다른 창에서 같은 게임이 진행되고 있어요</h2><p class="muted">게임은 한 창에서만 해 주세요. 이 창을 닫거나, 이 창에서 계속하려면 아래 버튼을 누르세요.</p><div class="acts"><button class="btn primary" id="reloadTab">이 창에서 이어하기</button></div>`,'confirm');
  $('#reloadTab').onclick=()=>location.reload();
});
/* 시대 여행 중에 창을 닫거나 뒤로 가려 하면 한 번 확인 */
window.addEventListener('beforeunload',e=>{if(E||V){e.preventDefault();e.returnValue=''}});
/* 키를 꾹 누르고 있을 때 반복 입력 무시: 대사·보기가 저절로 넘어가거나 골라지지 않게 */
window.addEventListener('keydown',e=>{
  if(e.repeat&&(e.key==='Enter'||e.key===' '||/^[0-9]$/.test(e.key))&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();e.stopImmediatePropagation()}
},true);

/* 키보드: Enter·Space로 대사 넘기기, 숫자키로 보기 고르기, Esc로 닫기 */
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!overlay.hidden&&overlay.dataset.dismiss==='1'){const c=$('#cx');if(c)c.click();return}
  if(!overlay.hidden) return;
  const tag=document.activeElement.tagName;
  if(/^[1-9]$/.test(e.key)&&!/INPUT|TEXTAREA/.test(tag)){const b=$$('#dlg .choice:not([disabled])')[+e.key-1];if(b){e.preventDefault();b.click();return}}
  if((e.key==='Enter'||e.key===' ')&&stage.classList.contains('vn-mode')&&(WAIT||typing)&&!(tag==='BUTTON'&&document.activeElement.id!=='go')){e.preventDefault();vnAdvance()}
});

probeAudio(); probeImages(); updateHud(); setPlayer(); screenTitle();
</script>

</body>
</html>
